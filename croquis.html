<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - La Hielera</title>
    <link rel="stylesheet" href="style.css">

    </header>

    <div class="plano-hielera">
        <!-- SECCIÓN SUPERIOR -->
        <div class="seccion-superior">
            <!-- ZONA VIP -->
            <div class="zona-vip">
                <div class="bloque-marron-top-vip"></div>

                    <div class="texto-vip">VIP</div>

                <div class="bloque-marron-bottom-vip"></div>
            </div>

            <!-- ZONA RUMBERA -->
            <div class="zona-rumbera">
                <div class="titulo-zona">RUMBERA</div>
                <div class="grid-rumbera">
                    <div class="mesa" id="rum-1"></div><div class="mesa" id="rum-2"></div><div class="mesa" id="rum-3"></div><div class="mesa" id="rum-4"></div>
                    <div class="mesa" id="rum-5"></div><div class="mesa" id="rum-6"></div><div class="mesa" id="rum-7"></div><div class="mesa" id="rum-8"></div>
                    <div class="mesa" id="rum-9"></div><div class="mesa" id="rum-10"></div><div class="mesa" id="rum-11"></div><div class="mesa" id="rum-12"></div>

            <div class="bloque-negro-derecho"></div>

                    <div class="mesa" id="lat-1"></div><div class="mesa" id="l2-2"></div><div class="mesa" id="l2-3"></div>

</html>
