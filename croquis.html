<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - La Hielera</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="croquis.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;400;700;900&display=swap" rel="stylesheet">
</head>
<body>

<div class="croquis-container">
    <header class="croquis-header">
        <h1>RESERVAR MESA</h1>
        <div class="leyenda">
            <span class="badge libre">Libre</span>
            <span class="badge pendiente">Pendiente</span>
            <span class="badge confirmada">Ocupada</span>
        </div>
    </header>

    <!-- PLANO BASADO EN EL SVG LIMPIO -->
    <div class="plano-hielera">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2970 3840" class="svg-croquis">
            <!-- Fondo General -->
            <path fill="#1A1A1A" d="M0 0L2970 0L2970 1136.86L2970 2722.31L2970 3840L0 3840L0 2778.67L0 1081.9L0 0Z"/>
            
            <!-- Estructura / Bloques del Local -->
            <path fill="#A47048" d="M1103.67 346.605C1141.56 347.858 1181.74 347.049 1219.81 346.989L1220.31 1814.84L307.836 1814.09L307.894 1032.41L307.98 786.013C307.992 753.896 309.5 692.521 307.508 663.637C310.181 564.351 307.889 447.574 307.878 346.928L823.198 346.932C916.122 346.943 1010.86 348.159 1103.67 346.605Z"/>

            <!-- Mesas interactivas (IDs conectados a tu JS de Firebase) -->
            <!-- Puedes añadir o mapear los IDs directamente en los elementos rect del SVG -->
            <g id="mesas-container">
                <rect class="mesa" id="vip-1" x="323" y="519" width="124" height="131" fill="#FEFEFE" />
                <rect class="mesa" id="vip-2" x="323" y="685" width="124" height="131" fill="#FEFEFE" />
                <rect class="mesa" id="rum-1" x="494" y="519" width="131" height="131" fill="#FEFEFE" />
                <rect class="mesa" id="rum-2" x="494" y="684" width="131" height="131" fill="#FEFEFE" />
                <rect class="mesa" id="lat-1" x="1080" y="519" width="125" height="131" fill="#FEFEFE" />
            </g>
        </svg>
    </div>
</div>

<script type="module" src="croquis.js"></script>
</body>
</html>
